name: The Impostor CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # Esegue il push diretto SOLO sul main
  pull_request:
    branches: [ "main" ] # Esegue sulle PR dirette al main

jobs:
  lint-commits:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@v6 # <-- QUESTA È LA MAGIA CHE RISOLVE L'ERRORE!

  build-lobby:
    name: Build & Test Lobby Service (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LobbyService
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build with Gradle (includes tests)
        run: ./gradlew build
      - name: Test Docker build
        run: docker build -t theimpostor-lobby:latest .

  build-game-engine:
    name: Build & Test Game Engine (Go 1.24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game-engine
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Download Go modules
        run: go mod download
      - name: Run Tests
        run: go test ./...
      - name: Build Binary
        run: go build -o engine ./cmd/server
      - name: Test Docker build
        run: docker build -t theimpostor-engine:latest .

  build-comm-service:
    name: Build & Test Comm Service (Node.js 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: comm-service
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'comm-service/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Build TypeScript
        run: npm run build
      - name: Test Docker build
        run: docker build -t theimpostor-comm:latest .

  build-front-end:
    name: Build & Lint Front End (Node.js 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'front-end/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type Check & Build
        run: npm run build