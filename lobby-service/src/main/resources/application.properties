spring.application.name=LobbyService

# Server
server.port=8080

# MongoDB Atlas - Variabile d'ambiente MONGODB_URI
app.mongodb.uri=${MONGODB_URI}

# Logging
logging.level.it.unibo.lobbyservice=DEBUG
logging.level.org.mongodb.driver=INFO

# CORS
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# SpringDoc OpenAPI (Swagger)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true

# Comm-Service callback URL (per notifiche WebSocket)
app.comm-service.url=${COMM_SERVICE_URL:http://localhost:3000}

# JWT
app.jwt.secret=${JWT_SECRET:TheImpostorSuperSecretJwtKey2026_MustBe256BitsOrMore_PleaseChangeInProd!!}
app.jwt.expiration=86400000

